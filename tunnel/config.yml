# Copied to %USERPROFILE%\.cloudflared\config.yml on the box.
# The tunnel was created from the Mac (that is where `cloudflared tunnel login`
# wrote cert.pem), so the credentials JSON is copied over to the box separately.
# The JSON is a secret and is NOT in this repo.
tunnel: <TUNNEL-UUID>
credentials-file: %USERPROFILE%\.cloudflared\<TUNNEL-UUID>.json

ingress:
  - hostname: mcp.andreglegg.no
    service: http://127.0.0.1:8787
  - service: http_status:404
